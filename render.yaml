# Backend service avec Docker
services:
  - type: web
    name: chasecart-backend
    env: docker
    dockerfilePath: ./Web application/docker/backend/Dockerfile
    dockerContext: ./Web application
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: chasecart-2329d
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

# Frontend service avec Docker
  - type: web
    name: chasecart-frontend
    env: docker
    dockerfilePath: ./Web application/docker/frontend/Dockerfile
    dockerContext: ./Web application
    plan: free
    envVars:
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyD0zh_y0_4QJWQXWqPvOdGjHE3Ua31ixnA
